{% extends "base.html" %}

{% block content %}
<h2>{% if object %}Редактировать задачу{% else %}Создать задачу{% endif %}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
    <a href="{% url 'tasks:list' %}">Отмена</a>
</form>
{% endblock %}
