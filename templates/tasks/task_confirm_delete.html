{% extends "base.html" %}

{% block content %}
<h2>Удалить задачу?</h2>
<p>Вы уверены, что хотите удалить "{{ task.title }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'tasks:detail' task.pk %}">Отмена</a>
</form>
{% endblock %}
